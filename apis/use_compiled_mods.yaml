name: "Use Compiled Mods"
forge-1.20.1:
  gradle: |
    def compileModsDir = layout.projectDirectory.dir('compile-mods-1.20.1').asFile

    if (!compileModsDir.exists()) {
        if (compileModsDir.mkdirs()) {
            logger.lifecycle("Created ${compileModsDir}")
        } else {
            logger.warn("Could not create ${compileModsDir}. Please create it manually before adding compiled mod jars.")
        }
    }

    def ensureCompiledModsDirTask = tasks.register('ensureCompiledModsDir') {
        outputs.dir compileModsDir
        doLast {
            if (!compileModsDir.exists()) {
                if (compileModsDir.mkdirs()) {
                    logger.lifecycle("Created ${compileModsDir}")
                } else {
                    logger.warn("Could not create ${compileModsDir}. Please create it manually before adding compiled mod jars.")
                }
            }
        }
    }

    repositories {
        flatDir {
            name = 'compile-mods'
            dirs compileModsDir
        }
    }

    def hasModImplementation = configurations.findByName('modImplementation') != null
    def fgExtension = extensions.findByName('fg')

    dependencies {
        fileTree(dir: compileModsDir, include: '*.jar').each { compileModJar ->
            def basename = compileModJar.name.substring(0, compileModJar.name.length() - '.jar'.length())
            def versionSep = basename.lastIndexOf('-')

            if (versionSep <= 0 || versionSep >= basename.length() - 1) {
                logger.warn("Skipping invalid compiled mod jar name: ${compileModJar.name}. Expected: modname-minecraftversion-modversion.jar")
            } else {
                def artifactId = basename.substring(0, versionSep)
                def version = basename.substring(versionSep + 1)
                def dependencyNotation = "compile-mods:${artifactId}:${version}"

                logger.lifecycle("Adding compiled mod dependency: ${dependencyNotation}")

                if (hasModImplementation) {
                    modImplementation dependencyNotation
                } else if (fgExtension != null) {
                    implementation fgExtension.deobf(dependencyNotation)
                } else {
                    logger.warn("No modImplementation configuration or fg.deobf extension was found. Adding ${dependencyNotation} as a plain implementation dependency.")
                    implementation dependencyNotation
                }
            }
        }
    }

    ['compileJava', 'runClient', 'runServer', 'build'].each { taskName ->
        tasks.matching { it.name == taskName }.configureEach {
            dependsOn ensureCompiledModsDirTask
        }
    }
  update_files:
    - ~
